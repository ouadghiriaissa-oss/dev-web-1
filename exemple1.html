```html
<!-- <pre> : Affiche un texte en conservant les espaces et les retours à la ligne. -->

<pre>
Bonjour
    Bienvenue
        en HTML
</pre>

<!-- <span> : Permet de cibler ou de modifier une petite partie d'un texte. -->

<p>Bonjour <span >tout le monde</span></p>


<!-- <div> : Sert à regrouper plusieurs éléments HTML dans un même bloc. -->

<div>
    <h2>Mon titre</h2>
    <p>Mon paragraphe</p>
</div>

<!-- <ul> : Crée une liste non ordonnée, généralement avec des puces. -->

<ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ul>

<!-- <ol> : Crée une liste ordonnée, généralement numérotée. -->

<ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
</ol>
<!-- <li> : Représente un élément à l'intérieur d'une liste <ul> ou <ol>. -->
<ul>
    <li>Premier élément</li>
    <li>Deuxième élément</li>
</ul>
```
