 <!-- <table> : Permet de créer un tableau en HTML. -->

<table border="2">

    <!-- <tr> : Crée une ligne dans le tableau. -->
    <!-- <th> : Crée une cellule d'en-tête (titre de colonne). -->
    <tr>
        <th>Nom</th>
        <th>Âge</th>
        <th>Niveau d études</th>
    </tr>

    <!-- <td> : Crée une cellule contenant une donnée. -->
    <tr>
        <td>Aissa</td>
        <td>18</td>
        <td>2ème année IF</td>
    </tr>

</table>
